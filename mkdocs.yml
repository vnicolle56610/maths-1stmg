nav:
  - "🏠 Accueil": index.md
  - "📈 Progression": progression.md
  - "📖 Notions":
      - "N01 — Rentrée, données, logique": notions/N01-rentree-donnees-logique.md
      - "N02 — Proportions, pourcentages, évolutions": notions/N02-proportions-pourcentages-evolutions.md
      - "N03 — Calcul algébrique, équations": notions/N03-calcul-algebrique-equations.md
      - "N04 — Fonctions, registres, lectures": notions/N04-fonctions-registres-lectures.md
      - "N05 — Taux de variation, fonctions monotones": notions/N05-taux-variation-fonctions.md
      - "N06 — Second degré, paraboles": notions/N06-second-degre-paraboles.md
      - "N07 — Second degré factorisé": notions/N07-second-degre-factorise.md
      - "N08 — Suites numériques, modèles discrets": notions/N08-suites-numeriques-modeles.md
      - "N09 — Suites arithmétiques et géométriques": notions/N09-suites-arithmetiques-geometriques.md
      - "N10 — Évolution, seuils, Python": notions/N10-evolution-seuils-python.md
      - "N11 — Nombre dérivé, tangentes": notions/N11-nombre-derive-tangentes.md
      - "N12 — Fonction dérivée, polynômes": notions/N12-fonction-derivee-polynomes.md
      - "N13 — Variations, extremums": notions/N13-variations-extremums.md
      - "N14 — Synthèse d'analyse, gestion": notions/N14-synthese-analyse-gestion.md
      - "N15 — Statistiques à deux variables": notions/N15-statistiques-deux-variables.md
      - "N16 — Ajustement affine": notions/N16-ajustement-affine.md
      - "N17 — Probabilités conditionnelles": notions/N17-probabilites-conditionnelles.md
      - "N18 — Bernoulli, arbres": notions/N18-bernoulli-arbres.md
      - "N19 — Variables aléatoires, espérance": notions/N19-variables-aleatoires-esperance.md
      - "N20 — Synthèse annuelle, épreuve anticipée": notions/N20-synthese-annuelle-epreuve.md
  - "📝 TD": td/index.md
  - "⚡ Automatismes": automatismes/index.md
  - "✅ Corrigés publiés": corriges/index.md
  - "ℹ️ À propos & licence": a-propos.md
  - "Toutatice (Pronote)": https://www.toutatice.fr/portail

theme:
  name: material
  language: fr
  logo: assets/images/logo_lycee_franklin.png
  favicon: assets/images/logo_lycee_franklin.png
  palette:
    - scheme: default
      primary: white
      accent: green
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.highlight

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.superfences
extra_css:
  - stylesheets/extra.css
extra_javascript:
  - javascripts/pdf-new-tab.js
  - javascripts/toutatice-header.js
  - javascripts/goatcounter.js
  - javascripts/compteur-visites.js
